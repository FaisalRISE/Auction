<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>Auction</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem("auc_theme");}catch(e){}
  if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}
  document.documentElement.setAttribute("data-theme",t);})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#070b1a;--surface:#0e1730;--card:#142042;--card2:#1a2952;--line:#243260;--line2:#33457a;
  --gold:#e8c050;--gold2:#c8a030;--goldDk:#8a6a1f;--text:#eef2fb;--muted:#9fb0d4;--dim:#6b7ca6;
  --green:#34d399;--greenDk:#059669;--red:#fb7185;--orange:#fb923c;--blue:#60a5fa;
}
/* ── LIGHT THEME ── */
:root[data-theme="light"]{
  --bg:#f3f5fb;--surface:#ffffff;--card:#ffffff;--card2:#eef2fa;--line:#dbe2f0;--line2:#c3cde3;
  --gold:#a57508;--gold2:#8f6406;--goldDk:#8a6a1f;--text:#101a3a;--muted:#46557a;--dim:#76839f;
  --green:#047857;--greenDk:#065f46;--red:#be123c;--orange:#c2410c;--blue:#1d4ed8;
  --hdrbg:rgba(243,245,251,.92);--tint:#101a3a0a;--tint2:#101a3a12;--overlay:rgba(16,26,58,.45);--flashbg:rgba(243,245,251,.95);
  color-scheme:light;
}
:root,:root[data-theme="dark"]{--hdrbg:rgba(7,11,26,.92);--tint:#ffffff08;--tint2:#ffffff12;--overlay:rgba(3,6,15,.82);--flashbg:rgba(3,6,15,.9)}
:root[data-theme="dark"]{color-scheme:dark}
[data-theme="light"] body::before{background:radial-gradient(ellipse at 15% 0%,#c8a03014,transparent 55%),radial-gradient(ellipse at 85% 100%,#1d4ed80d,transparent 55%)}
[data-theme="light"] input,[data-theme="light"] select{background:#f7f9fe}
[data-theme="light"] .b-gold,[data-theme="light"] .big.raise,[data-theme="light"] .tabs button.on,[data-theme="light"] .ctabs button.on{background:linear-gradient(135deg,#f3cd55,#e2a915);color:#241900}
[data-theme="light"] .logo{background:linear-gradient(135deg,#f3cd55,#d39b0c)}
[data-theme="light"] .b-green{background:linear-gradient(135deg,#34d399,#10b981);color:#022c1e}
[data-theme="light"] .b-orange,[data-theme="light"] .big.match{background:linear-gradient(135deg,#fdba74,#f97316);color:#2a1000}
[data-theme="light"] .b-blue{background:linear-gradient(135deg,#93c5fd,#3b82f6);color:#04173a}
[data-theme="light"] .bid,[data-theme="light"] .pres-bid{text-shadow:none}
[data-theme="light"] .big:disabled{background:var(--card2);color:var(--dim);box-shadow:none;border:1px solid var(--line)}
[data-theme="light"] .pres-av{background:linear-gradient(135deg,#f3cd55,#d39b0c);box-shadow:0 12px 40px #c8a03040}
[data-theme="light"] .card,[data-theme="light"] .tcard,[data-theme="light"] .budget{box-shadow:0 1px 3px #101a3a14}
[data-theme="light"] .pres{background:radial-gradient(ellipse at 50% 15%,#ffffff,#e6ebf6 70%)}
[data-theme="light"] .prt,[data-theme="light"] .bcard{background:#ffffff;border-color:var(--line);box-shadow:0 1px 3px #101a3a14}
[data-theme="light"] .prt.top{background:#fff7df;border-color:var(--gold)}
[data-theme="light"] .prt .b{color:var(--muted)}
[data-theme="light"] .bcard .h{border-bottom-color:var(--line)}
[data-theme="light"] .bcard .r.o{color:var(--dim)}
.themebtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:5px 10px;font-size:15px;line-height:1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:90px}
/* iPhone: no double-tap zoom / 300ms delay on anything tappable, and taps on non-buttons still register */
button,a,input,select,label,[data-act]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[data-act]{cursor:pointer}
body{min-height:100vh;min-height:100dvh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body::before{content:'';position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(ellipse at 15% 0%,#16235566,transparent 55%),radial-gradient(ellipse at 85% 100%,#1a2d6e44,transparent 55%)}
#app{position:relative;z-index:1}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:16px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--gold2)}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:700;margin-bottom:5px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom))}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:var(--hdrbg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--goldDk));display:flex;align-items:center;justify-content:center;font-size:20px}
.brand h1{font-family:'Cinzel',serif;font-size:19px;font-weight:900;letter-spacing:1px;line-height:1}
.brand p{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:700;margin-top:3px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-weight:600}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block}
.conn.live i{background:var(--green);box-shadow:0 0 8px var(--green)}
.conn.poll i{background:var(--orange)}
.conn.off i{background:var(--red)}
.whoami{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:10px;font-weight:700;font-size:15px;transition:.12s;white-space:nowrap}
.btn:disabled{opacity:.38;cursor:not-allowed}
.b-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.b-green{background:linear-gradient(135deg,var(--green),var(--greenDk));color:#04231a}
.b-red{background:var(--card);color:var(--red);border:1px solid #5a2440}
.b-ghost{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.b-ghost:hover:not(:disabled){color:var(--text);border-color:var(--line2)}
.b-blue{background:linear-gradient(135deg,var(--blue),#2563eb);color:#031634}
.b-orange{background:linear-gradient(135deg,var(--orange),#ea580c);color:#2a1000}
.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.xs{padding:4px 9px;font-size:12px;border-radius:7px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.sec{font-family:'Cinzel',serif;font-size:20px;font-weight:700;margin:18px 0 10px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--tint2);color:var(--muted);white-space:nowrap}

/* two-column live layout */
.live{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media(max-width:860px){.live{grid-template-columns:1fr}}

/* block card */
.block{padding:18px 20px;background:linear-gradient(160deg,var(--card2),var(--card));border-color:var(--line2);position:relative;overflow:hidden}
.block::before{content:'';position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#c8a03020,transparent 70%);pointer-events:none}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:5px 11px;border-radius:20px;background:#c8a0301f;color:var(--gold)}
.tag.warn{background:#fb923c22;color:var(--orange)}
.pname{font-family:'Cinzel',serif;font-size:40px;font-weight:900;line-height:1.05;margin:12px 0 4px;word-break:break-word}
.base{color:var(--muted);font-size:15px}
.bidlbl{margin-top:16px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800}
.bid{font-family:'Cinzel',serif;font-size:54px;font-weight:900;color:var(--gold);line-height:1;margin:4px 0;text-shadow:0 2px 24px #c8a03044}
.leader{font-size:17px;font-weight:700;min-height:24px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.state{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:.5px}
.st-lead{background:#34d39922;color:var(--green);border:1px solid #34d39955}
.st-tie{background:#fb923c22;color:var(--orange);border:1px solid #fb923c55}
.st-out{background:#fb718522;color:var(--red);border:1px solid #fb718555}
.st-none{background:var(--tint);color:var(--muted);border:1px solid var(--line)}
.timer{display:flex;align-items:center;gap:10px;margin-top:14px}
.tbar{flex:1;height:8px;border-radius:4px;background:var(--tint2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .25s linear}
.tmr{font-family:'Cinzel',serif;font-weight:900;font-size:20px;min-width:52px;text-align:right}
.going{font-size:13px;font-weight:800;letter-spacing:1px;min-height:18px;margin-top:4px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.big{width:100%;border:none;border-radius:16px;padding:16px 10px;font-weight:900;font-size:16px;letter-spacing:1px;line-height:1.25;min-height:86px}
.big b{display:block;font-family:'Cinzel',serif;font-size:24px;letter-spacing:0;margin-top:2px}
.big.raise{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300;box-shadow:0 6px 24px #c8a03033}
.big.match{background:linear-gradient(135deg,var(--orange),#ea580c);color:#2a1000}
.big:disabled{background:var(--card);color:var(--dim);box-shadow:none;border:1px solid var(--line);cursor:not-allowed}
.why{font-size:12px;color:var(--dim);text-align:center;margin-top:5px;min-height:15px}
.wait{text-align:center;padding:40px 10px;color:var(--dim)}
.wait .big-ic{font-size:56px;opacity:.35;margin-bottom:8px}

/* budget panel */
.budget{padding:16px}
.maxbox{background:linear-gradient(135deg,#c8a0301c,#c8a03008);border:1px solid #c8a03055;border-radius:14px;padding:14px;text-align:center}
.maxbox .v{font-family:'Cinzel',serif;font-size:38px;font-weight:900;color:var(--gold);line-height:1.05}
.maxbox .l{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800}
.maxbox .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--surface);border-radius:11px;padding:10px;text-align:center}
.kpi .v{font-size:19px;font-weight:800}
.kpi .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}
.sq{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;background:var(--surface);border-radius:9px;margin-bottom:5px;font-size:15px}
.sq.open{border:1px dashed var(--line2);background:transparent;color:var(--dim)}
.sq .pr{font-weight:800;color:var(--gold)}
.hd{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:800;margin:14px 0 7px}
.trow{display:grid;grid-template-columns:minmax(0,1.5fr) 1fr 1fr 44px;gap:6px;align-items:center;padding:7px 9px;border-radius:9px;font-size:14px}
.trow:nth-child(odd){background:var(--tint)}
.trow.top{background:#c8a03018;outline:1px solid #c8a03055}
.trow.me{outline:1px solid var(--line2)}
.trow .n{display:flex;align-items:center;gap:7px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trow .r{text-align:right}
@media(max-width:480px){.trow{grid-template-columns:minmax(0,1.7fr) .8fr .8fr 34px;font-size:13px;padding:7px 7px}.pname{font-size:34px}.bid{font-size:46px}}

/* admin */
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--line);overflow-x:auto;margin-top:14px}
.tabs button{padding:8px 14px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;border-radius:8px;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ctrl .grow{flex:1}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.tcard.top{border-color:var(--gold);background:#c8a03012}
.tcard .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard .nm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.tcard .meta{font-size:12px;color:var(--dim);margin-top:3px}
.tcard .ppl{font-size:13px;color:var(--muted);margin-top:5px}
.tcard .bb{display:flex;gap:6px;margin-top:8px}
.tcard .bb .btn{flex:1}
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper button{width:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:20px;font-weight:800}
.stepper input{text-align:center;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fgrid .hint{font-size:12px;color:var(--dim);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:800;padding:10px;border-bottom:1px solid var(--line);background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tw{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
.st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.s-pool{background:#60a5fa22;color:var(--blue)} .s-sold{background:#34d39922;color:var(--green)}
.s-unsold{background:#fb718522;color:var(--red)} .s-captain{background:#c8a03022;color:var(--gold)}
.inline{display:flex;gap:6px;align-items:center}
.inline select,.inline input{padding:6px 8px;font-size:16px;width:auto}

/* login */
.login{max-width:520px;margin:30px auto;padding:22px}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}
.tpick button{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
.tpick button.on{border-color:var(--gold);background:#c8a0301f}
.tpick .c{font-size:12px;color:var(--muted);margin-top:2px}

/* overlays */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:900;background:var(--card2);border:1px solid var(--gold2);color:var(--text);padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 10px 30px #000a;max-width:92vw;text-align:center;transition:opacity .25s;pointer-events:none}
.toast.err{border-color:var(--red);color:#ffd1d9}
.toast.ok{border-color:var(--green)}
.flash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:800;display:flex;align-items:center;justify-content:center;background:var(--flashbg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fin .25s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.flash .in{text-align:center;padding:20px;animation:pop .45s cubic-bezier(.18,.89,.32,1.28)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.flash .stamp{font-family:'Cinzel',serif;font-size:clamp(56px,14vw,120px);font-weight:900;color:var(--green);transform:rotate(-6deg);text-shadow:0 4px 40px #34d39966;letter-spacing:4px}
.flash .stamp.uns{color:var(--red);text-shadow:0 4px 40px #fb718566}
.flash .p1{font-size:clamp(24px,5vw,40px);font-weight:900;margin-top:10px}
.flash .p2{font-size:clamp(20px,4vw,32px);color:var(--gold);font-weight:800;margin-top:4px}
.flash .p3{font-size:clamp(17px,3vw,24px);color:var(--muted);margin-top:10px}
.modal-bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:850;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:18px;max-width:460px;width:100%;padding:20px}
.modal h3{font-family:'Cinzel',serif;font-size:19px;margin-bottom:10px}
details.rules{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.rules summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.rules ul{margin:8px 0 2px 18px;color:var(--muted);font-size:14px;line-height:1.7}

/* home chooser */
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.home{grid-template-columns:1fr}}
.homecard{display:block;text-decoration:none;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:20px 18px;transition:.12s}
.homecard:hover{border-color:var(--gold2);transform:translateY(-2px)}
.homecard.gold{background:linear-gradient(160deg,#c8a03024,var(--card2));border-color:#c8a03066}
.homecard .ic{font-size:34px}.homecard .t{font-size:20px;font-weight:800;margin-top:8px}.homecard .s{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
a.btn{text-decoration:none}
/* bid history + pause */
.feed{margin-top:14px}
.fd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;font-size:14px}
.fd:nth-child(even){background:var(--tint)}
.fd.new{background:#c8a03016}
.pausebar{margin-top:12px;padding:10px 14px;border-radius:12px;background:#fb923c1f;border:1px solid #fb923c66;color:var(--orange);font-weight:900;letter-spacing:1px;text-align:center;animation:pz 1.6s ease-in-out infinite}
@keyframes pz{0%,100%{opacity:1}50%{opacity:.55}}
.pres-feed{width:min(620px,90%);margin-top:10px}
.pres-feed .fd{font-size:19px;padding:7px 12px}
.pres-feed .hd{display:none}
/* branding: lead logos, organiser line, sponsors, footer, editor */
.lead{display:flex;align-items:center;gap:8px;flex:none}
.lead img{height:40px;width:auto;max-width:130px;object-fit:contain;display:block}
html[data-theme="dark"] img.inv{filter:invert(1) brightness(1.9)}
.brand .evsub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600;letter-spacing:0;text-transform:none}
.brand .byOrg{font-size:11px;color:var(--dim);margin-top:2px;font-weight:700;letter-spacing:0;text-transform:none}
.sponsFoot{margin-top:22px;padding:14px 4px 12px;border-top:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:800}
.sponsRow{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-top:9px}
.sponsItem{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:14px}
.sponsItem img{height:34px;width:auto;max-width:120px;object-fit:contain}
.sitefoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:14px 4px 0;border-top:1px solid var(--line)}
.sitefoot img{height:30px;width:auto;max-width:90px;object-fit:contain}
.fLine{font-size:12px;color:var(--dim);line-height:1.65}.fLine b{color:var(--muted)}
.fLine a,.tel{color:var(--gold);font-weight:700;text-decoration:none}
.orgRow{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;margin-bottom:8px}
.orgRow.host{border-color:#c8a03066}
.orgPos{width:22px;font-weight:800;color:var(--dim);padding-top:16px;text-align:center;flex:none;font-size:12px}
.orgLogo{width:100px;height:58px;flex:none;border:1px dashed var(--line2);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card);padding:5px;margin:0;text-transform:none;letter-spacing:0}
.orgLogo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.orgLogo.empty span{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:center}
.orgMid{flex:1;min-width:0}
.orgBtns{display:flex;flex-direction:column;gap:4px}
@media(max-width:560px){.orgRow{flex-wrap:wrap}.orgMid{flex:1 1 100%;order:3}.lead img{height:32px;max-width:96px}}
.pres-spons{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;padding:10px 24px 14px;border-top:1px solid var(--line)}
.pres-spons img{height:46px;width:auto;max-width:180px;object-fit:contain}
.pres-spons .sponsItem{font-size:17px}
/* captain plan */
.ctabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--line);margin-top:14px}
.ctabs button{flex:1;padding:10px 12px;border:none;background:transparent;color:var(--muted);font-weight:800;font-size:15px;border-radius:9px}
.ctabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.plrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 10px;border-radius:11px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.plrow.fav{border-color:#c8a03066;background:#c8a03010}
.plrow.gone{opacity:.55}
.plrow .star{background:none;border:none;font-size:24px;line-height:1;padding:2px 4px;color:var(--dim)}
.plrow.fav .star{color:var(--gold)}
.plrow .nm{font-weight:800;font-size:16px;flex:1;min-width:110px}
.plrow .ins{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-left:36px}
.plrow .ins label{margin:0;font-size:10px}
.plrow .ins input{padding:7px 9px;font-size:16px}
.plrow .ins .f{display:flex;flex-direction:column;gap:3px}
.tgtbar{margin-top:12px;padding:10px 13px;border-radius:12px;background:#c8a0301c;border:1px solid #c8a03066;font-weight:700;font-size:15px;line-height:1.45}
.chk{padding:10px 12px;border-radius:11px;font-size:14px;line-height:1.5;margin-top:8px}
.chk.ok{background:#34d39914;border:1px solid #34d39944;color:var(--green)}
.chk.warn{background:#fb923c14;border:1px solid #fb923c55;color:var(--orange)}
.chk.bad{background:#fb718514;border:1px solid #fb718555;color:var(--red)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.fchips button{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:13px}
.fchips button.on{border-color:var(--gold);color:var(--gold);background:#c8a0301a}
/* presenter */
.pres{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 15%,#13245e,#04060f 70%)}
.pres-h{display:flex;align-items:center;justify-content:space-between;padding:18px 32px}
.pres-h h1{font-family:'Cinzel',serif;font-size:30px;font-weight:900;letter-spacing:2px}
.pres-b{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:28px;padding:6px 32px 28px}
@media(max-width:1000px){.pres-b{grid-template-columns:1fr}}
.pres-p{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pres-av{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldDk));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:72px;font-weight:900;color:#1a1300;box-shadow:0 12px 60px #c8a03055;margin-bottom:18px}
.pres-name{font-family:'Cinzel',serif;font-size:clamp(44px,6vw,76px);font-weight:900;line-height:1}
.pres-bid{font-family:'Cinzel',serif;font-size:clamp(64px,9vw,120px);font-weight:900;color:var(--gold);line-height:1;margin:10px 0;text-shadow:0 4px 50px #c8a03066}
.pres-lead{font-size:30px;font-weight:800;min-height:40px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}
.pres-going{font-family:'Cinzel',serif;font-size:42px;font-weight:900;letter-spacing:3px;min-height:52px;margin-top:10px}
.pres-rail{display:flex;flex-direction:column;gap:9px}
.prt{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:13px;padding:10px 15px}
.prt.top{border-color:var(--gold);background:#c8a03020}
.prt .a{display:flex;justify-content:space-between;align-items:center}
.prt .nm{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.prt .mx{font-size:21px;font-weight:900;color:var(--gold)}
.prt .b{display:flex;justify-content:space-between;font-size:13px;color:#8899b4;margin-top:3px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:6px 32px 28px;flex:1}
@media(max-width:1000px){.board{grid-template-columns:1fr 1fr}}
.bcard{background:#ffffff0a;border:1px solid #ffffff1f;border-radius:16px;padding:14px 16px}
.bcard .h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff1a;padding-bottom:8px;margin-bottom:8px}
.bcard .h .nm{font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px}
.bcard .h .lf{font-size:19px;font-weight:800;color:var(--green)}
.bcard .r{display:flex;justify-content:space-between;font-size:18px;padding:4px 0}
.bcard .r .p{font-weight:800;color:var(--gold)}
.bcard .r.o{color:#ffffff40;font-style:italic}
</style>

const HOST_DEFAULT={name:"RISE Sports",phone:"9987029222"};
const MAX_ORGS=3, MAX_SPONS=6, LOGO_BUDGET=120000;                       // public view-only mode, no login
const WANT_LOGIN=!!(Q.get("login")||Q.get("team")||Q.get("admin")||Q.get("org"));
let LOGIN_ORG=Q.get("org")==="1";
let LOGIN_TEAM=Q.get("team")||"";
let LOGIN_ADMIN=Q.get("admin")==="1";

/* ═══════════════ HELPERS ═══════════════ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
const short=n=>{n=n||0;if(Math.abs(n)>=100000)return "₹"+(+(n/100000).toFixed(2))+"L";if(Math.abs(n)>=1000)return "₹"+(+(n/1000).toFixed(1))+"K";return "₹"+n;};
const num=v=>parseInt(String(v==null?"":v).replace(/[^0-9]/g,""))||0;
const T=id=>D.teams.find(t=>t.id===id);
const P=id=>D.players.find(p=>p.id===id);
const capOf=t=>t&&P(t.captain_id);
const soldOf=tid=>D.players.filter(p=>p.team_id===tid&&p.status==="sold");
const spent=tid=>soldOf(tid).reduce((s,p)=>s+(p.price||0),0);
const left=tid=>D.cfg.purse-spent(tid);
const bought=tid=>soldOf(tid).length;
const openSlots=tid=>Math.max(0,D.cfg.slots-bought(tid));
const maxBid=tid=>{const o=D.cfg.slots-bought(tid);return o<=0?0:Math.max(0,left(tid)-D.cfg.base*(o-1));};
const lotOpen=()=>!!(D.lot&&D.lot.status==="open"&&D.lot.player_id);
const ties=()=>(D.lot&&D.lot.ties)||[];
const topTeams=()=>D.lot&&D.lot.lead_team?[D.lot.lead_team,...ties()]:[];
const atTop=tid=>topTeams().includes(tid);
const nextRaise=()=>D.lot.lead_team?D.lot.bid+D.cfg.inc:D.lot.bid;
const tdot=t=>`<span class="dot" style="background:${esc(t?t.color:"#666")}"></span>`;
const tname=tid=>{const t=T(tid);return t?esc(t.name):"—";};
const poolCount=()=>D.players.filter(p=>p.status==="pool").length;
const unsoldCount=()=>D.players.filter(p=>p.status==="unsold").length;
const baseLink=()=>location.origin+location.pathname;

function canRaise(tid){
  if(!lotOpen())return{ok:false,why:"No player on the block"};
  if(D.lot.paused)return{ok:false,why:"Bidding is paused",amt:nextRaise()};
  if(openSlots(tid)<=0)return{ok:false,why:"Squad full"};
  if(D.lot.lead_team===tid&&!ties().length)return{ok:false,why:"You are the highest bidder"};
  const a=nextRaise();
  if(a>maxBid(tid))return{ok:false,why:"Over your max bid ("+fmt(maxBid(tid))+")",amt:a};
  return{ok:true,amt:a};
}
function canMatch(tid){
  if(!lotOpen()||!D.lot.lead_team)return{ok:false,hide:true,why:"Nothing to match yet"};
  if(D.lot.paused)return{ok:false,why:"Bidding is paused",amt:D.lot.bid};
  if(atTop(tid))return{ok:false,why:"You are at this price",amt:D.lot.bid};
  if(openSlots(tid)<=0)return{ok:false,why:"Squad full",amt:D.lot.bid};
  const thr=D.cfg.match_thr;
  if(thr>0&&D.lot.bid<thr)return{ok:false,why:"Match opens at "+fmt(thr),amt:D.lot.bid};
  if(D.lot.bid>maxBid(tid))return{ok:false,why:"Over your max bid ("+fmt(maxBid(tid))+")",amt:D.lot.bid};
  return{ok:true,amt:D.lot.bid};
}
function timeLeft(){ if(!lotOpen())return 0; if(D.lot.paused)return PAUSE_R; return Math.max(0,D.cfg.timer_sec-(Date.now()-SEQ_AT)/1000); }
function goingText(r){
  if(!lotOpen()||!D.lot.lead_team||D.lot.paused)return{t:"",c:""};
  const ts=D.cfg.timer_sec||20;
  if(r<=0)return{t:"FINAL CALL",c:"var(--gold)"};
  if(r<=ts*0.2)return{t:"GOING TWICE",c:"var(--red)"};
  if(r<=ts*0.4)return{t:"GOING ONCE",c:"var(--orange)"};
  return{t:"",c:""};
}

function errMsg(e){ const m=(e&&(e.message||e.details||e.hint))||""; return /fetch|network|Failed to/i.test(m)||!m ? "Network problem — check internet and try again" : "Server error: "+m; }
let toastT;
function toast(msg,kind){
  let t=$("#toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.className="toast "+(kind||"");t.textContent=msg;t.style.opacity="1";
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity="0",2600);
}
function confirmBox(msg,yes){
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal"><h3>Please confirm</h3><div style="color:var(--muted);line-height:1.5;margin-bottom:16px">${msg}</div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn b-ghost" id="cfN">Cancel</button><button class="btn b-gold" id="cfY">Yes</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#cfN").onclick=()=>bg.remove();
  bg.querySelector("#cfY").onclick=()=>{bg.remove();yes();};
}
function promptBox(title,lbl,val,ok){
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><label>${esc(lbl)}</label><input id="pbV" value="${esc(val)}" style="margin-bottom:14px"/>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn b-ghost" id="pbN">Cancel</button><button class="btn b-gold" id="pbY">Save</button></div></div>`;
  document.body.appendChild(bg);const i=bg.querySelector("#pbV");setTimeout(()=>i.focus(),30);
  bg.querySelector("#pbN").onclick=()=>bg.remove();
  const go=()=>{const v=i.value.trim();bg.remove();ok(v);};
  bg.querySelector("#pbY").onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go();};
}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast("Copied","ok");return;}catch(e){}
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("Copied","ok");}catch(e){toast("Couldn't copy — select and copy manually","err");}
  ta.remove();
}

  LAST_RES_AT=ra||null;

function readLogo(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(new Error("That file could not be read"));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error("That image could not be opened"));
      img.onload=()=>{ const draw=(mw,mh,type,q)=>{ const s=Math.min(1,mw/img.width,mh/img.height), cv=document.createElement("canvas");
          cv.width=Math.max(1,Math.round(img.width*s)); cv.height=Math.max(1,Math.round(img.height*s));
          const cx=cv.getContext("2d"); cx.imageSmoothingQuality="high";
          if(type==="image/jpeg"){cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);}
          cx.drawImage(img,0,0,cv.width,cv.height); return cv.toDataURL(type,q); };
        let url=draw(440,180,"image/png"); if(url.length>LOGO_BUDGET)url=draw(300,120,"image/png");
        if(url.length>LOGO_BUDGET)url=draw(440,180,"image/jpeg",.86);
        if(url.length>LOGO_BUDGET)return rej(new Error("That image is too detailed to store — try a simpler logo"));
        res(url); };
      img.src=fr.result; };
    fr.readAsDataURL(file); });
}

async function bid(action,team){
  if(BUSY)return; BUSY=true; render(true);
  const code=ME.code;
  try{
    const {data,error}=await sb.rpc("auc_bid",{p_team:team,p_code:code,p_action:action,p_seen_seq:D.lot?D.lot.seq:null});
    if(error)toast(errMsg(error),"err");
    else if(!data.ok)toast(data.msg,"err");
    else toast(action==="raise"?"Bid placed: "+fmt(num(data.msg)):"Matched "+fmt(num(data.msg)),"ok");
  }catch(e){toast("Network problem — try again","err");}
  BUSY=false; await fetchAll(); render(true);
}
async function adm(action,p,quiet){
  if(BUSY&&!quiet)return null;
  if(!quiet){BUSY=true;render(true);}
  let out=null;
  try{
    const {data,error}=await sb.rpc("auc_admin",{p_code:ME.code,p_action:action,p:p||{}});
    if(error)toast(errMsg(error),"err");
    else{ out=data; if(!quiet||!data.ok) toast(data.msg||"Done",data.ok?"ok":"err"); }
  }catch(e){toast("Network problem — try again","err");}
  if(!quiet)BUSY=false;
  await fetchAll(); render(!quiet);
  return out;
}
async function login(role,code){
  code=(code||"").trim(); if(!code){toast("Enter the passcode","err");return;}
  const {data,error}=await sb.rpc("auc_login",{p_role:role,p_code:code});
  if(error){toast(errMsg(error),"err");return;}
  if(!data){toast("Wrong passcode","err");return;}
  ME=role==="admin"?{role:"admin",team:null,code}:role==="organiser"?{role:"org",team:null,code}:{role:"team",team:role,code};
  saveSession(ME); TAB="live"; CTAB="live"; render(true); trackMe(); loadPlan();
}
function logout(){ for(const k in DIRTY)delete DIRTY[k]; PLAN={targets:{}}; PLAN_TEAM=null; PLAN_STATUS=""; CTAB="live"; ME=null; saveSession(null); CODES=null; LOGIN_ADMIN=false; LOGIN_ORG=false; OTAB="brand"; render(true); trackMe(); }

/* ═══════════════ RENDER ═══════════════ */
function render(force){
  const ae=document.activeElement;
  if(!force&&(PTR_DOWN||(ae&&ae.closest&&ae.closest("#app")&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)))){PENDING=true;return;}
  PENDING=false;
  const app=$("#app");
  if(!D.cfg){app.innerHTML=`<div class="wait" style="padding-top:120px"><div class="big-ic">🏆</div>${NET_OK?"Connecting…":"Can't reach the server — check your internet. Retrying…"}</div>`;return;}
  if(IS_PRES){app.innerHTML=viewPresenter();tick();return;}
  if(IS_WATCH){app.innerHTML=header()+viewWatch()+siteFooter();tick();return;}
  if(!ME){app.innerHTML=header()+(WANT_LOGIN?viewLogin():viewHome())+siteFooter();restoreDirty();return;}
  if(ME.role==="team"&&!T(ME.team)){logout();return;}
  app.innerHTML=header()+(ME.role==="admin"?viewAdmin():ME.role==="org"?viewOrg():viewCaptain())+siteFooter();
  restoreDirty();
  tick();
}
/* Never rebuild the screen while a button is being pressed, or the tap is lost. */
let PTR_DOWN=false, PTR_T=null;
function ptrRelease(){ PTR_DOWN=false; clearTimeout(PTR_T); setTimeout(()=>{if(PENDING)render();},350); }
document.addEventListener("pointerdown",()=>{PTR_DOWN=true; clearTimeout(PTR_T); PTR_T=setTimeout(ptrRelease,2000);},true);  // safety: never hold updates >2s
["pointerup","pointercancel","touchend","touchcancel"].forEach(ev=>document.addEventListener(ev,ptrRelease,true));
window.addEventListener("blur",ptrRelease);
document.addEventListener("focusout",()=>setTimeout(()=>{if(PENDING&&!PTR_DOWN)render();},350));
/* Keep whatever was typed if the screen is rebuilt underneath it. */
const DIRTY={};
document.addEventListener("input",e=>{const t=e.target;if(t&&t.id&&t.closest&&t.closest("#app")&&t.type!=="checkbox")DIRTY[t.id]=t.value;
  // plan fields: update the plan as you type, save shortly after
  const m=t&&t.id&&/^pl_(prio|max|note)_(.+)$/.exec(t.id);
  if(m&&ME&&ME.role==="team"){ const tg=PLAN.targets[m[2]]||(PLAN.targets[m[2]]={fav:true});
    if(m[1]==="note")tg.note=t.value.slice(0,60); else if(m[1]==="max")tg.max=num(t.value); else tg.prio=String(num(t.value)||"");
    savePlanSoon(); render(); }    // render waits until you leave the box
});
document.addEventListener("focusout",e=>{ const t=e.target; if(t&&t.id&&t.id.startsWith("pl_max_")){ const n=num(t.value); t.value=n?n.toLocaleString("en-IN"):""; delete DIRTY[t.id]; } });
function restoreDirty(){ for(const id in DIRTY){ const el=document.getElementById(id); if(el&&el.value!==DIRTY[id])el.value=DIRTY[id]; } }

/* ── MY PLAN tab ── */
function planSums(tid){
  const o=openSlots(tid), lf=left(tid), base=D.cfg.base;
  const avail=myTargets().filter(x=>available(x.p));
  const top=avail.slice(0,o);
  const sum=top.reduce((s,x)=>s+Math.max(base,num(x.t.max)||base),0);
  return {o,lf,base,avail,top,sum};
}
function viewPlan(tid){
  const s=planSums(tid), mx=maxBid(tid), sold=soldOf(tid).sort((a,b)=>b.price-a.price), cap=capOf(T(tid));
  const all=D.players.filter(p=>p.status!=="captain");
  const isT=p=>!!tgt(p.id);
  let list=all;
  if(PLAN_FILTER==="targets")list=all.filter(isT);
  if(PLAN_FILTER==="avail")list=all.filter(available);
  list=list.slice().sort((a,b)=>{
    const ta=isT(a),tb=isT(b); if(ta!==tb)return tb-ta;
    if(ta&&tb){const d=(num(PLAN.targets[a.id].prio)||99)-(num(PLAN.targets[b.id].prio)||99); if(d)return d;}
    const aa=available(a),ab=available(b); if(aa!==ab)return ab-aa;
    return a.name.localeCompare(b.name);});
  const rows=list.map(p=>{
    const t=PLAN.targets[p.id]||{}, fav=!!t.fav, gone=p.status==="sold";
    let chip="";
    if(lotOpen()&&D.lot.player_id===p.id) chip=`<span class="chip" style="color:var(--gold)">🔨 On the block</span>`;
    else if(gone&&p.team_id===tid) chip=`<span class="chip" style="color:var(--green)">✓ Yours · ${fmt(p.price)}</span>`;
    else if(gone) chip=`<span class="chip">Sold · ${tname(p.team_id)} · ${fmt(p.price)}</span>`;
    else if(p.status==="unsold") chip=`<span class="chip" style="color:var(--red)">unsold</span>`;
    return `<div class="plrow ${fav?"fav":""} ${gone&&p.team_id!==tid?"gone":""}">
      <button class="star" data-act="star" data-p="${p.id}" title="${fav?"Remove from targets":"Add to targets"}">${fav?"★":"☆"}</button>
      <span class="nm">${esc(p.name)}</span>${chip}
      ${fav?`<div class="ins">
        <div class="f" style="width:64px"><label>Priority</label><input id="pl_prio_${p.id}" inputmode="numeric" value="${esc(t.prio||"")}" placeholder="#"/></div>
        <div class="f" style="width:120px"><label>Max I'll pay ₹</label><input id="pl_max_${p.id}" inputmode="numeric" value="${num(t.max)?num(t.max).toLocaleString("en-IN"):""}" placeholder="${D.cfg.base.toLocaleString("en-IN")}"/></div>
        <div class="f" style="flex:1;min-width:150px"><label>Note</label><input id="pl_note_${p.id}" maxlength="60" value="${esc(t.note||"")}" placeholder="e.g. strong at net"/></div>
      </div>`:""}
    </div>`;}).join("")||`<div class="dim" style="padding:14px;text-align:center">${PLAN_FILTER==="targets"?"No targets yet — tap ☆ next to a player to add them.":"No players here."}</div>`;
  const nT=myTargets().length, nA=all.filter(available).length;
  // plan check
  let checks="";
  if(s.o===0) checks=`<div class="chk ok">✓ Squad complete.</div>`;
  else if(!nT) checks=`<div class="chk warn">Tap ☆ on the players you want, then set a priority and the most you'd pay.</div>`;
  else{
    if(s.avail.length<s.o) checks+=`<div class="chk warn">You have ${s.avail.length} target${s.avail.length!==1?"s":""} still available for ${s.o} open slot${s.o!==1?"s":""} — add a few backups.</div>`;
    if(s.sum>s.lf) checks+=`<div class="chk bad">⚠ Your top ${s.top.length} targets add up to <b>${fmt(s.sum)}</b> — that's <b>${fmt(s.sum-s.lf)}</b> more than your purse left (${fmt(s.lf)}).</div>`;
    const over=s.avail.filter(x=>num(x.t.max)>mx);
    if(over.length) checks+=`<div class="chk warn">Right now you can bid at most <b>${fmt(mx)}</b> on one player. Over that: ${over.map(x=>esc(x.p.name)+" ("+fmt(num(x.t.max))+")").join(", ")}.</div>`;
    if(!checks) checks=`<div class="chk ok">✓ Plan fits: your top ${s.top.length} target${s.top.length!==1?"s":""} cost up to <b>${fmt(s.sum)}</b>, leaving <b>${fmt(s.lf-s.sum)}</b>.</div>`;
  }
  const slots=[`<div class="sq"><span>👑 ${esc(cap?cap.name:"Captain")} <span class="dim" style="font-size:12px">captain</span></span><span class="pr" style="color:var(--dim)">free</span></div>`]
    .concat(sold.map(p=>`<div class="sq"><span>${esc(p.name)}</span><span class="pr">${fmt(p.price)}</span></div>`))
    .concat(s.top.map(x=>`<div class="sq open"><span>Open — plan: <b style="color:var(--text)">${esc(x.p.name)}</b></span><span>${fmt(Math.max(s.base,num(x.t.max)||s.base))}</span></div>`))
    .concat(Array.from({length:Math.max(0,s.o-s.top.length)},()=>`<div class="sq open"><span>Open slot</span><span>base ${fmt(s.base)}</span></div>`)).join("");

function printPlan(){

    <p class="m">Top ${s.top.length} available targets cost up to <b>${fmt(s.sum)}</b> of ${fmt(s.lf)} left.</p>`;

    <style>body{font-family:Arial,sans-serif;color:#111;margin:22px}h1{font-size:21px;color:#0d1b4b;border-bottom:3px solid #c8a030;padding-bottom:6px}h2{font-size:16px;color:#0d1b4b;margin-top:18px}

/* ═══════════════ TEAM IMAGES (PNG, drawn on a canvas — works offline, on iPhone and Android) ═══════════════ */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const CF=(wt,sz,fam)=>`${wt} ${sz}px ${fam||"Outfit, 'Segoe UI', system-ui, sans-serif"}`;
function fitTx(ctx,s,max){ s=String(s); if(ctx.measureText(s).width<=max)return s; while(s.length>1&&ctx.measureText(s+"…").width>max)s=s.slice(0,-1); return s+"…"; }
function teamRowsData(t){
  const cap=capOf(t), rows=[{name:cap?cap.name:"Captain",cap:true}];
  soldOf(t.id).sort((a,b)=>b.price-a.price).forEach(p=>rows.push({name:p.name,price:p.price}));
  for(let i=0;i<openSlots(t.id);i++)rows.push({open:true});
  return rows;
}
const IMG_ROW=58, IMG_CARD_TOP=132;
const imgCardH=()=>IMG_CARD_TOP+(1+D.cfg.slots)*IMG_ROW+22;
function drawTeamCard(ctx,t,x,y,w,h){
  ctx.fillStyle="#142042"; rr(ctx,x,y,w,h,24); ctx.fill(); ctx.strokeStyle="#33457a"; ctx.lineWidth=2; ctx.stroke();
  ctx.save(); rr(ctx,x,y,w,h,24); ctx.clip(); ctx.fillStyle=t.color; ctx.fillRect(x,y,w,10); ctx.restore();
  ctx.textBaseline="middle";
  let cy=y+56;
  ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(x+38,cy,11,0,Math.PI*2); ctx.fill();
  ctx.textAlign="right"; ctx.fillStyle="#34d399"; ctx.font=CF(800,26); const lt=short(left(t.id))+" left"; ctx.fillText(lt,x+w-28,cy);
  const ltw=ctx.measureText(lt).width;
  ctx.textAlign="left"; ctx.fillStyle="#eef2fb"; ctx.font=CF(800,34); ctx.fillText(fitTx(ctx,t.name,w-ltw-110),x+60,cy);
  cy+=40; ctx.fillStyle="#9fb0d4"; ctx.font=CF(500,19); ctx.fillText(`Spent ${fmt(spent(t.id))}  ·  ${bought(t.id)}/${D.cfg.slots} bought`,x+30,cy);
  const top=y+IMG_CARD_TOP;
  teamRowsData(t).forEach((r,i)=>{
    const ry=top+i*IMG_ROW, rh=IMG_ROW-10, mid=ry+rh/2;
    rr(ctx,x+20,ry,w-40,rh,13);
    if(r.open){ ctx.fillStyle="rgba(255,255,255,0.02)"; ctx.fill(); ctx.setLineDash([7,7]); ctx.strokeStyle="#33457a"; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.fillStyle=r.cap?"rgba(232,192,80,0.10)":"#0e1730"; ctx.fill(); }
    ctx.textAlign="right";
    let rightW=0;
    if(r.cap){ ctx.font=CF(800,17); ctx.fillStyle="#e8c050"; ctx.fillText("CAPTAIN",x+w-40,mid); rightW=ctx.measureText("CAPTAIN").width; }
    else if(!r.open){ ctx.font=CF(800,25); ctx.fillStyle="#e8c050"; const pr=fmt(r.price); ctx.fillText(pr,x+w-40,mid); rightW=ctx.measureText(pr).width; }
    ctx.textAlign="left"; ctx.font=CF(r.open?500:700,25); ctx.fillStyle=r.open?"#6b7ca6":"#eef2fb";
    ctx.fillText(fitTx(ctx,r.open?"Open slot":(r.cap?"★ "+r.name:r.name),w-rightW-110),x+40,mid);
  });
}
/* draw a logo on a small white plate (works for dark or coloured logos alike) */
function drawLogoChip(ctx,im,x,y,h,maxW){
  const ih=h-12, iw=Math.min(maxW-16,im.naturalWidth*(ih/im.naturalHeight)), dh=im.naturalHeight*(iw/im.naturalWidth);
  const w=iw+16; ctx.fillStyle="#ffffff"; rr(ctx,x,y,w,h,10); ctx.fill();
  ctx.drawImage(im,x+8,y+(h-dh)/2,iw,dh); return w;
}
function makeTeamsImage(tid){
  const spIm=sponsShown().map(o=>imgReady(o.logo)).filter(Boolean), orgIm=orgsShown().map(o=>imgReady(o.logo)).filter(Boolean);
  const org=organiserLine(), ev=eventPhone(), hb=hostB();
  const teams=tid?[T(tid)]:D.teams, S=2, ch=imgCardH(), gap=28, pad=40, headH=170, footH=(spIm.length||org||ev)?110:64;
  let W,cols;
  if(tid){ W=1080; cols=1; } else { cols=teams.length<=4?2:3; W=cols===2?1360:1920; }
  const cw=(W-pad*2-gap*(cols-1))/cols, rowsN=Math.ceil(teams.length/cols);
  const H=headH+rowsN*ch+(rowsN-1)*gap+footH+pad/2;
  const cv=document.createElement("canvas"); cv.width=W*S; cv.height=H*S;
  const ctx=cv.getContext("2d"); ctx.scale(S,S);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#13245e"); g.addColorStop(1,"#05081a"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // header
  let tx=pad+94;
  ctx.textBaseline="middle";
  if(orgIm.length){ let x=pad; orgIm.slice(0,3).forEach(im=>{ x+=drawLogoChip(ctx,im,x,42,80,tid?200:240)+10; }); tx=x+12; }
  else { ctx.fillStyle="#e8c050"; rr(ctx,pad,46,72,72,18); ctx.fill(); ctx.textAlign="center"; ctx.font=CF(400,40); ctx.fillText("🏆",pad+36,84); }
  ctx.textAlign="left"; ctx.fillStyle="#eef2fb"; ctx.font=CF(900,46,"Cinzel, Georgia, serif");
  ctx.fillText(fitTx(ctx,brandTitle().toUpperCase(),W-tx-pad),tx,70);
  ctx.fillStyle="#e8c050"; ctx.font=CF(800,20);
  ctx.fillText(fitTx(ctx,(tid?"TEAM SQUAD":"TEAM SQUADS")+(eventSub()?"  ·  "+eventSub():""),W-tx-pad),tx+2,108);
  teams.forEach((t,i)=>{ const c=i%cols, r=Math.floor(i/cols); drawTeamCard(ctx,t,pad+c*(cw+gap),headH+r*(ch+gap),cw,ch); });
  // footer: organiser + contact + host on the left, sponsor logos on the right
  let rightX=W-pad;
  if(spIm.length){ const hgt=50; const ws=spIm.map(im=>Math.min(170,im.naturalWidth*((hgt-12)/im.naturalHeight)+16));
    const total=ws.reduce((a,b)=>a+b,0)+(ws.length-1)*10; let x=W-pad-total; const y=H-footH+18;
    ctx.fillStyle="#6b7ca6"; ctx.font=CF(800,13); ctx.textAlign="right"; ctx.fillText("SPONSORS",x-12,y+hgt/2); ctx.textAlign="left";
    rightX=x-110; spIm.forEach(im=>{ x+=drawLogoChip(ctx,im,x,y,hgt,170)+10; }); }
  ctx.textAlign="left"; const lw=Math.max(200,rightX-pad); let ly=H-footH+(footH>64?26:28);
  if(org){ ctx.fillStyle="#c3cde3"; ctx.font=CF(700,18); ctx.fillText(fitTx(ctx,"Organised by "+org,lw),pad,ly); ly+=26; }
  ctx.fillStyle="#6b7ca6"; ctx.font=CF(500,16);
  ctx.fillText(fitTx(ctx,`Purse ${fmt(D.cfg.purse)} per team  ·  ${new Date().toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}${ev?"  ·  Questions: "+ev:""}`,lw),pad,ly); ly+=24;
  if(footH>64){ ctx.fillStyle="#56658a"; ctx.font=CF(500,14); ctx.fillText(fitTx(ctx,`${org?"Hosted on":"Run by"} ${hb.name}${hb.phone?"  ·  "+hb.phone:""}`,lw),pad,ly); }
  return cv;
}
function dataURLtoBlob(u){ const [m,b]=u.split(","), bin=atob(b), arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:m.split(":")[1].split(";")[0]}); }
let IMG_LAST=null;   // {url,name,blob}
function openImageModal(tid){

  const url=cv.toDataURL("image/png"), base=(tid?T(tid).name:brandTitle()+" all teams").replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"");
  IMG_LAST={url,name:base+".png",blob:dataURLtoBlob(url)};
  let canShare=false; try{ canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([IMG_LAST.blob],IMG_LAST.name,{type:"image/png"})]})); }catch(e){}
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="imgModal";
  bg.innerHTML=`<div class="modal" style="max-width:720px;max-height:92vh;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">${tid?esc(T(tid).name):"All teams"} — image</h3><button class="btn b-ghost xs" data-act="imgClose">✕</button></div>

    <div class="dim" style="font-size:12px;margin-top:8px">Tip: on a phone you can also press and hold the picture to save it.</div></div>`;

function imgDownload(){
  if(!IMG_LAST)return;
  const a=document.createElement("a"), u=URL.createObjectURL(IMG_LAST.blob);

function imgShare(){

}

    case "brandInvert": { if(!canBrand())break; const o=findBrand(d.k,d.id); if(!o)break; o.invert=!logoInv(d.k==="host"?Object.assign({},o,{_host:true}):o); brandChanged(); break; }
    case "brandClearLogo": { if(!canBrand())break; const o=findBrand(d.k,d.id); if(!o)break; confirmBox(d.k==="host"?"Go back to the RISE Sports logo?":"Remove this logo?",()=>{o.logo="";o.invert=d.k==="host";brandChanged(d.k==="host"?"RISE logo restored":"Logo removed");}); break; }
    case "brandRemove": { if(!canBrand())break; const o=findBrand(d.k,d.id); if(!o)break; confirmBox(`Remove <b>${esc(o.name||"this entry")}</b>?`,()=>{ if(d.k==="organisers")BRAND.organisers=BRAND.organisers.filter(x=>x.id!==d.id); else BRAND.sponsors=BRAND.sponsors.filter(x=>x.id!==d.id); brandChanged("Removed"); }); break; }
    case "brandMove": { if(!canBrand())break; const list=brandList(d.k), i=list.findIndex(o=>o.id===d.id), j=i+parseInt(d.d); if(i<0||j<0||j>=list.length)break; const t=list[i]; list[i]=list[j]; list[j]=t; brandChanged(); break; }
    case "copyOrgInvite": copyText(`🎨 *${brandTitle()}* — Organiser login\n\n🔗 ${baseLink()}?org=1\n🔑 Organiser PIN: *${CODES.organiser||""}*\n\nUse it to add organiser & sponsor logos and contact details. Keep it private.`); break;
    case "theme": setTheme(curTheme()==="light"?"dark":"light"); break;
    case "img": openImageModal(d.t==="all"?null:d.t); break;
    case "imgClose": { const m=$("#imgModal"); if(m)m.remove(); break; }
    case "imgDownload": imgDownload(); break;
    case "imgShare": imgShare(); break;
    case "tab": TAB=d.t; if(TAB==="log")loadLogs(); if(TAB==="teams")CODES=null; render(true); break;
    case "nextRandom": adm("nominate",{}); break;
    case "bringUp": { const v=($("#pickSel")||{}).value; if(!v){toast("Pick a player first","err");break;} adm("nominate",{player_id:v}); break; }
    case "sold": adm("sold",{team:d.t}); break;
    case "drawLots": { const tops=topTeams(); const w=tops[Math.floor(Math.random()*tops.length)];
      confirmBox(`🎲 The draw picked <b style="color:${esc(T(w).color)}">${tname(w)}</b>.<br>Sell <b>${esc(P(D.lot.player_id).name)}</b> to them for <b>${fmt(D.lot.bid)}</b>?`,()=>adm("sold",{team:w})); break; }
    case "unsold": adm("unsold"); break;
    case "undo": adm("undo"); break;
    case "resetBid": adm("reset_bid"); break;
    case "pause": adm("pause"); break;
    case "resume": adm("resume"); break;
    case "hold": confirmBox(`Put <b>${esc(P(D.lot.player_id).name)}</b> back in the pool without a result?<br><br><span style="font-size:13px">Bids for this player are cleared and he can be called again later. This is <b>not</b> the same as Unsold — use Unsold if nobody wanted him.</span>`,()=>adm("hold")); break;
    case "secondPass": adm("second_pass"); break;
    case "distribute": confirmBox("Give each unsold player to the team with an open slot and the most purse left, at base price?",()=>adm("distribute")); break;
    case "incQuick": { const v=Math.max(500,D.cfg.inc+num(d.d)*(d.d.startsWith("-")?-1:1)); adm("set_config",{inc:v}); break; }
    case "admRaise": bid("raise",d.t); break;
    case "admMatch": bid("match",d.t); break;
    case "release": confirmBox(`Release <b>${esc(P(d.p).name)}</b> back to the pool? Their price is refunded to the team.`,()=>adm("release",{player_id:d.p})); break;
    case "assign": delete DIRTY["as_p_"+d.p]; adm("assign",{player_id:d.p,team:$("#as_t_"+d.p).value,price:num($("#as_p_"+d.p).value)}); break;
    case "rename": promptBox("Rename player","Name",P(d.p).name,v=>{if(v)adm("rename_player",{player_id:d.p,name:v});}); break;
    case "removeP": confirmBox(`Remove <b>${esc(P(d.p).name)}</b> from the auction?`,()=>adm("remove_player",{player_id:d.p})); break;
    case "addPlayer": { const v=($("#newName")||{}).value; if(!v||!v.trim()){toast("Type a name","err");break;} adm("add_player",{name:v.trim()}); break; }
    case "saveTeam": saveTeamName(d.t); break;
    case "teamColor": adm("set_team",{team:d.t,color:d.c}); break;
    case "setCap": { const v=$("#cap_"+d.t).value; if(!v){toast("Pick the new captain","err");break;} confirmBox(`Make <b>${esc(P(v).name)}</b> captain of ${tname(d.t)}? The current captain goes back into the pool.`,()=>adm("set_captain",{team:d.t,player_id:v})); break; }
    case "setCode": promptBox("Change passcode","New passcode (min 4 characters)",CODES[d.r]||"",v=>{if(v)adm("set_code",{role:d.r,code:v}).then(()=>{CODES=null;render(true);});}); break;
    case "copyInvite": copyText(inviteText(d.t)); break;
    case "copyAll": copyText(D.teams.map(t=>inviteText(t.id)).join("\n\n— — —\n\n")+`\n\n👀 Everyone can watch live (no login): ${baseLink()}?view=watch`); break;
    case "copyLink": copyText(d.l==="presenter"?baseLink()+"?view=presenter":d.l==="watch"?baseLink()+"?view=watch":baseLink()); break;
    case "stp": { const i=$("#"+d.f); const v=Math.max(0,num(i.value)+parseInt(d.d)); i.value=(d.f==="f_slots"||d.f==="f_timer")?String(v):v.toLocaleString("en-IN"); break; }
    case "saveCfg": adm("set_config",{purse:num($("#f_purse").value),base:num($("#f_base").value),inc:Math.max(1,num($("#f_inc").value)),
        slots:Math.max(1,num($("#f_slots").value)),match_thr:num($("#f_match").value),timer_sec:Math.max(5,num($("#f_timer").value))}); break;
    case "resetAll": confirmBox("Reset the whole auction? Every player except captains goes back to the pool and the log is cleared.",()=>adm("reset_auction")); break;
    case "reloadLog": loadLogs(); break;
    case "csv": exportCsv(); break;
    case "sound": SOUND=!SOUND; if(SOUND)speak("Sound on"); render(true); break;
    case "fs": try{ const de=document.documentElement;
        if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
        else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de);} }catch(err){} break;
  }
});
function saveTeamName(tid){
  const i=$("#tn_"+tid); const v=(i?i.value:"").trim();
  if(!v){toast("Team name can't be empty","err");return;}
  delete DIRTY["tn_"+tid];
  if(T(tid)&&T(tid).name===v){toast("Team saved","ok");return;}
  adm("set_team",{team:tid,name:v});
}
document.addEventListener("change",e=>{
  const el=e.target;
  // branding edits (auctioneer / organiser)
  if(el&&el.dataset&&el.dataset.act==="logoFile"&&canBrand()){
    const f=el.files&&el.files[0], k=el.dataset.k, id=el.dataset.id; el.value=""; if(!f)return;
    if(!/^image\//.test(f.type)){toast("That is not an image file","err");return;}
    readLogo(f).then(url=>{ const o=findBrand(k,id); if(!o)return; o.logo=url; o.invert=false; brandChanged("Logo added"); }).catch(err=>toast(String(err.message||err),"err"));
    return;
  }
  if(el&&el.id&&canBrand()){
    let hit=false;
    if(el.id==="ev_title"||el.id==="ev_sub"||el.id==="ev_contact"){ BRAND.event[el.id.slice(3)]=el.value.trim(); hit=true; }
    else if(el.id==="hp_phone"){ BRAND.host.phone=el.value.trim(); hit=true; }
    else if(el.id.startsWith("bn_")){ const parts=el.id.split("_"), o=findBrand(parts[1],parts.slice(2).join("_")); if(o){ o.name=el.value.trim(); if(parts[1]==="host"&&!o.name)o.name=HOST_DEFAULT.name; hit=true; } }
    if(hit){ delete DIRTY[el.id]; brandChanged("Saved"); return; }
  } if(el.dataset&&el.dataset.act==="fee") adm("set_fee",{player_id:el.dataset.p,paid:el.checked},true);
  if(el.id&&el.id.startsWith("tn_")) saveTeamName(el.id.slice(3));
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="lgCode"){const b=document.querySelector('[data-act="doLogin"]');if(b)b.click();}
  if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("tn_")){e.target.blur();}
  if(e.key==="Enter"&&e.target.id&&/^(ev_|bn_|hp_)/.test(e.target.id)){e.target.blur();}
  if(e.key==="Enter"&&e.target.id==="newName"){const b=document.querySelector('[data-act="addPlayer"]');if(b)b.click();}
});

/* ═══════════════ BOOT ═══════════════ */
(async function boot(){
  { const m=document.querySelector('meta[name="theme-color"]'); if(m)m.setAttribute("content",curTheme()==="light"?"#f3f5fb":"#070b1a"); }
  const s=loadSession();
  if(s&&!IS_PRES){
    try{ const {data}=await sb.rpc("auc_login",{p_role:s.role==="admin"?"admin":s.role==="org"?"organiser":s.team,p_code:s.code}); if(data)ME=s; else saveSession(null);}catch(e){ME=s;}
  }
  await fetchAll(); render(true); subscribe(); presenceSetup(); loadPlan();
})();
</script>
</body>
</html>
